[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compliance-engine"
version = "0.1.0"
description = "Autonomous pipeline: find small-business sites with accessibility and AI-search gaps, reach out, close, remediate, bill."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.4.0",
  "playwright>=1.50",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "stripe>=10.0",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
compliance-engine = "engine.cli:main"

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.setuptools.package-data]
engine = ["vendor/*", "data/*", "dashboard/templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
